<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion – CHL Gestion Stock</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #00d084;
      --text: #c9d1d9;
      --border: #30363d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
    }

    .btn-login {
      background: var(--accent);
      border: none;
      font-weight: 600;
    }

    input {
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
    }

    h3 {
      color: var(--accent);
    }
  </style>
</head>

<body>

<div class="login-card mx-3">

  <h3 class="text-center mb-4">Connexion CHL Stock</h3>

  <form id="loginForm">

    <div class="mb-3">
      <label class="form-label">Pseudo Discord</label>
      <input type="text" class="form-control" id="discord" placeholder="ex: pseudo" required>
    </div>

    <button type="button" class="btn btn-secondary w-100 mb-3" id="sendCodeBtn">
      Envoyer le code
    </button>

    <div class="mb-3">
      <label class="form-label">Code reçu</label>
      <input type="text" class="form-control" id="code" placeholder="123456" required>
    </div>

    <button type="submit" class="btn btn-login w-100">
      Se connecter
    </button>

  </form>

</div>


<script>

/*
IMPORTANT

Pour l'instant ton bot tourne sur ton PC

Donc l'API est :

http://localhost:3000/api

Quand tu mettras le bot sur ton serveur
tu devras remplacer par :

https://ton-serveur/api
*/

const API_BASE = 'https://chl-bot-gestion.onrender.com/api'



document.getElementById('sendCodeBtn').addEventListener('click', async () => {

  const user = document.getElementById('discord').value.trim()

  if (!user) return alert('Entre ton pseudo Discord')

  try {

    const res = await fetch(`${API_BASE}/send_code?user=${encodeURIComponent(user)}`)

    const data = await res.json()

    if (data.success) {

      alert('Code envoyé en message privé Discord !')

    } else {

      alert(data.error || 'Erreur')

    }

  } catch (err) {

    alert('Impossible de contacter le serveur')

  }

})


document.getElementById('loginForm').addEventListener('submit', async e => {

  e.preventDefault()

  const user = document.getElementById('discord').value.trim()
  const code = document.getElementById('code').value.trim()

  if (!user || !code) return alert('Remplis tous les champs')

  try {

    const res = await fetch(`${API_BASE}/verify?user=${encodeURIComponent(user)}&code=${encodeURIComponent(code)}`)

    const data = await res.json()

    if (data.success) {

      localStorage.setItem('chl_logged_in', JSON.stringify({
        user,
        time: Date.now()
      }))

      window.location.href = 'home1.html'

    } else {

      alert(data.error || 'Code invalide')

    }

  } catch {

    alert('Erreur serveur')

  }

})

</script>

</body>
</html>
