<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion – CHL Gestion Stock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #00d084;
      --text: #c9d1d9;
      --border: #30363d;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
    }
    .btn-send {
      background: #444c56;
      border: none;
    }
    .btn-send:hover {
      background: #586069;
    }
    .btn-login {
      background: var(--accent);
      border: none;
      font-weight: 600;
    }
    .btn-login:hover {
      background: #00b070;
    }
    input, input:focus {
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,208,132,0.2);
    }
    h3 {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="login-card mx-3">
  <h3 class="text-center mb-4">Connexion CHL Stock</h3>
  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label">Pseudo Discord</label>
      <input type="text" class="form-control" id="discord" placeholder="ex: pseudo ou pseudo#0000" required>
    </div>

    <button type="button" class="btn btn-send w-100 mb-3" id="sendCodeBtn">
      Envoyer le code
    </button>

    <div class="mb-3">
      <label class="form-label">Code reçu (valide 10 min)</label>
      <input type="text" class="form-control" id="code" placeholder="123456" required>
    </div>

    <button type="submit" class="btn btn-login w-100">
      Se connecter
    </button>
  </form>
</div>

<script>
const API_BASE = 'https://ton-serveur.wispbyte.com/api';   // ← CHANGE ÇA !!!

document.getElementById('sendCodeBtn').addEventListener('click', async () => {
  const user = document.getElementById('discord').value.trim();
  if (!user) return alert('Entre ton pseudo Discord');

  try {
    const res = await fetch(`${API_BASE}/send_code?user=${encodeURIComponent(user)}`);
    const data = await res.json();
    if (data.success) {
      alert('Code envoyé en message privé Discord ! Vérifie tes DM.');
    } else {
      alert(data.error || 'Erreur lors de l\'envoi');
    }
  } catch (err) {
    alert('Impossible de contacter le serveur.');
    console.error(err);
  }
});

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const user = document.getElementById('discord').value.trim();
  const code = document.getElementById('code').value.trim();

  if (!user || !code) return alert('Remplis tous les champs');

  try {
    const res = await fetch(`${API_BASE}/verify?user=${encodeURIComponent(user)}&code=${encodeURIComponent(code)}`);
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('chl_logged_in', JSON.stringify({ user, time: Date.now() }));
      window.location.href = 'home1.html';
    } else {
      alert(data.error || 'Code invalide ou expiré');
    }
  } catch (err) {
    alert('Erreur de connexion au serveur');
    console.error(err);
  }
});
</script>

</body>
</html>
