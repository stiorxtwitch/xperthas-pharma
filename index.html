<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion – CHL Gestion Stock</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/C3KSVoE.png">

  <!-- OPEN GRAPH -->
  <meta property="og:title" content="Gestion Stock – Centre Hospitalier de Liège">
  <meta property="og:description" content="Accès sécurisé au système de gestion des stocks du Centre Hospitalier de Liège.">
  <meta property="og:image" content="https://i.imgur.com/UtYP7fH.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080a0c;
      --surface: #0f1214;
      --card: #141820;
      --accent: #c0392b;
      --accent-glow: rgba(192, 57, 43, 0.35);
      --accent-light: #e74c3c;
      --text: #e8eaf0;
      --text-muted: #6b7280;
      --border: #1e2530;
      --border-light: #2a3340;
      --success: #27ae60;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background ambiance */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(192,57,43,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 80% 20%, rgba(192,57,43,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid lines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(192,57,43,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(192,57,43,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header logo */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      border: 1px solid var(--border-light);
      background: var(--card);
      margin-bottom: 1rem;
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .logo-wrap img {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }

    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 3px;
      color: var(--white);
      line-height: 1;
    }

    .header p {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 0.4rem;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
    }

    .form-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-group { margin-bottom: 1.2rem; }

    .form-control {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-control::placeholder { color: #3a4050; }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border-light);
      color: var(--text);
      margin-bottom: 1.2rem;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent-light);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
      box-shadow: 0 6px 28px var(--accent-glow);
    }

    .btn:active { transform: scale(0.98); }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    /* Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast notifications */
    #toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .toast {
      background: var(--card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 0.9rem 1.2rem;
      min-width: 280px;
      max-width: 340px;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: slideIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
    }

    .toast.hide {
      animation: slideOut 0.3s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(60px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(60px); }
    }

    .toast-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .toast-body { flex: 1; }
    .toast-title { font-weight: 600; font-size: 0.88rem; margin-bottom: 0.2rem; }
    .toast-msg { font-size: 0.8rem; color: var(--text-muted); }

    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--accent); }
    .toast.info    { border-left: 3px solid #3b82f6; }

    /* Loading overlay */
    #loader {
      position: fixed;
      inset: 0;
      background: rgba(8,10,12,0.8);
      backdrop-filter: blur(4px);
      z-index: 8888;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
    }

    #loader.active { display: flex; }

    .loader-ring {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">Connexion en cours…</div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<div class="wrapper">
  <div class="header">
    <div class="logo-wrap">
      <img src="https://i.imgur.com/C3KSVoE.png" alt="CHL Logo">
    </div>
    <h1>CHL Stock</h1>
    <p>Centre Hospitalier de Liège</p>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">Pseudo Discord</label>
      <input type="text" class="form-control" id="discord" placeholder="ex: pseudo#0000" autocomplete="off">
    </div>

    <button class="btn btn-secondary" id="sendCodeBtn">
      <span id="sendSpinner" class="spinner"></span>
      <span id="sendText">📨 Envoyer le code par DM</span>
    </button>

    <div class="divider"></div>

    <div class="form-group">
      <label class="form-label">Code reçu</label>
      <input type="text" class="form-control" id="code" placeholder="123456" maxlength="6" autocomplete="off">
    </div>

    <button class="btn btn-primary" id="loginBtn">
      <span id="loginSpinner" class="spinner"></span>
      <span id="loginText">Se connecter</span>
    </button>
  </div>
</div>

<script>
  const API_BASE = 'https://chl-bot-gestion-1.onrender.com';

  /* ---- Toast ---- */
  function toast(type, title, msg) {
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `
      <div class="toast-icon">${icons[type]}</div>
      <div class="toast-body">
        <div class="toast-title">${title}</div>
        ${msg ? `<div class="toast-msg">${msg}</div>` : ''}
      </div>`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => {
      el.classList.add('hide');
      setTimeout(() => el.remove(), 350);
    }, 4000);
  }

  /* ---- Loader ---- */
  function showLoader(txt) {
    document.querySelector('.loader-text').textContent = txt || 'Chargement…';
    document.getElementById('loader').classList.add('active');
  }
  function hideLoader() {
    document.getElementById('loader').classList.remove('active');
  }

  /* ---- Envoyer code ---- */
  document.getElementById('sendCodeBtn').addEventListener('click', async () => {
    const user = document.getElementById('discord').value.trim();
    if (!user) return toast('error', 'Pseudo manquant', 'Entre ton pseudo Discord');

    const btn = document.getElementById('sendCodeBtn');
    const spinner = document.getElementById('sendSpinner');
    const text = document.getElementById('sendText');

    btn.disabled = true;
    spinner.style.display = 'block';
    text.textContent = 'Envoi en cours…';

    await new Promise(r => setTimeout(r, 800));

    try {
      const res = await fetch(`${API_BASE}/send_code?user=${encodeURIComponent(user)}`);
      const data = await res.json();
      if (data.success) {
        toast('success', 'Code envoyé !', 'Vérifie tes messages privés Discord');
      } else {
        toast('error', 'Erreur', data.error || 'Utilisateur introuvable');
      }
    } catch {
      toast('error', 'Serveur inaccessible', 'Vérifie ta connexion');
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
      text.textContent = '📨 Envoyer le code par DM';
    }
  });

  /* ---- Login ---- */
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const user = document.getElementById('discord').value.trim();
    const code = document.getElementById('code').value.trim();
    if (!user || !code) return toast('error', 'Champs manquants', 'Remplis tous les champs');

    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('loginSpinner');
    const text = document.getElementById('loginText');

    btn.disabled = true;
    spinner.style.display = 'block';
    text.textContent = 'Vérification…';

    await new Promise(r => setTimeout(r, 1000));

    try {
      const res = await fetch(`${API_BASE}/verify?user=${encodeURIComponent(user)}&code=${encodeURIComponent(code)}`);
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('chl_logged_in', JSON.stringify({ user, time: Date.now() }));
        toast('success', 'Connecté !', 'Redirection…');
        showLoader('Chargement du tableau de bord…');
        await new Promise(r => setTimeout(r, 1500));
        window.location.href = 'home1.html';
      } else {
        toast('error', 'Échec', data.error || 'Code invalide ou expiré');
        btn.disabled = false;
        spinner.style.display = 'none';
        text.textContent = 'Se connecter';
      }
    } catch {
      toast('error', 'Erreur serveur', 'Réessaie dans quelques instants');
      btn.disabled = false;
      spinner.style.display = 'none';
      text.textContent = 'Se connecter';
    } finally {
      hideLoader();
    }
  });
</script>
</body>
</html>
