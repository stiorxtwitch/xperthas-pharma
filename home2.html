<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Salle de soin – CHL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
--bg:#0d1117;
--card:#161b22;
--accent:#00d084;
--danger:#ff4d4d;
--text:#c9d1d9;
--border:#30363d;
--table-head:#21262d;
}

body{
background:var(--bg);
color:var(--text);
font-family:'Segoe UI',system-ui,sans-serif;
}

.navbar{
background:#010409!important;
border-bottom:1px solid var(--border);
}

.table{
--bs-table-bg:var(--card);
--bs-table-color:var(--text);
--bs-table-border-color:var(--border);
}

.table thead th{
background:var(--table-head);
color:var(--accent);
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">
<div class="container-fluid">

<span class="navbar-brand fw-bold">
Stock Salle de soin – CHL
</span>

<button class="btn btn-outline-danger ms-auto" onclick="logout()">
Déconnexion
</button>

</div>
</nav>

<div class="container mt-4">

<a href="home1.html" class="btn btn-outline-info mb-4">
Aller au stock Pharmacie →
</a>

<div class="table-responsive">

<table class="table table-hover table-bordered">

<thead>
<tr>
<th>Produit</th>
<th>Quantité</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="stockTable"></tbody>

</table>

</div>

</div>


<script>

if(!localStorage.getItem('chl_logged_in')){
window.location.href='index.html'
}

const logged = JSON.parse(localStorage.getItem('chl_logged_in'))
const USER = logged?.user || 'Inconnu'

const API_BASE = 'https://chl-bot.wispbyte.com/api'

const ITEMS = [

"Tablette",
"Garrot",
"Pansement de terrain",
"Bandage élastique",
"Pansement hémostatique",
"Kit chirurgical",
"Pansement compressif",
"Injecteur d'épinéphrine",
"Injecteur de morphine",
"Propofol100ml",
"Propofol 250ml",
"Poche de sang 250ml",
"Poche de sang 500ml",
"Poche de sang 750ml",
"Poche de sang 1000ml",
"Kit de réanimation d'urgence",
"Moniteur ECG",
"Fentanyl",
"Ampoulier médical",
"Collier cervical",
"Accès intra-osseux(IO)",
"Accès intraveineux(IV)",
"Dispositif de massage cardiaque"

]

let stock = JSON.parse(localStorage.getItem('chl_salle_stock')) || {}

ITEMS.forEach(item=>{
if(!(item in stock)) stock[item]=0
})

const tbody=document.getElementById('stockTable')

ITEMS.forEach(item=>{

const tr=document.createElement('tr')

const id=item.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'')

tr.innerHTML=`

<td>${item}</td>

<td id="qty-${id}">
${stock[item]}
</td>

<td>

<button class="btn btn-success btn-sm me-1"
onclick="changeStock('${item}','add')">
Ajouter
</button>

<button class="btn btn-danger btn-sm"
onclick="changeStock('${item}','remove')">
Retirer
</button>

</td>

`

tbody.appendChild(tr)

})

async function changeStock(item,type){

let qty = prompt("Quelle quantité ?")

qty = parseInt(qty)

if(!qty || qty <= 0){
alert("Quantité invalide")
return
}

let delta = type === "add" ? qty : -qty

stock[item] = Math.max(0,(stock[item]||0)+delta)

const id=item.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'')

document.getElementById(`qty-${id}`).textContent = stock[item]

localStorage.setItem('chl_salle_stock',JSON.stringify(stock))

try{

await fetch(`${API_BASE}/log_stock`,{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

user:USER,
item:item,
delta:delta,
location:'Salle de soin'

})

})

}catch(err){

console.warn("Log non envoyé",err)

}

}

function logout(){

localStorage.removeItem('chl_logged_in')
localStorage.removeItem('chl_salle_stock')

window.location.href='index.html'

}

</script>

</body>
</html>
