<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Pharmacie – CHL</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/C3KSVoE.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080a0c;
  --surface: #0f1214;
  --card: #141820;
  --accent: #c0392b;
  --accent-glow: rgba(192,57,43,0.3);
  --accent-light: #e74c3c;
  --text: #e8eaf0;
  --text-muted: #6b7280;
  --border: #1e2530;
  --border-light: #2a3340;
  --success: #27ae60;
  --success-glow: rgba(39,174,96,0.3);
  --white: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 50% 40% at 10% 0%, rgba(192,57,43,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 30% 30% at 90% 100%, rgba(192,57,43,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(192,57,43,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(192,57,43,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* Navbar */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,10,12,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nav-logo {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

.nav-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 2px;
  color: var(--white);
}

.nav-badge {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: rgba(192,57,43,0.15);
  color: var(--accent-light);
  border: 1px solid rgba(192,57,43,0.3);
  padding: 0.2rem 0.6rem;
  border-radius: 20px;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nav-user {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.nav-user span {
  color: var(--text);
  font-weight: 500;
}

.btn-nav {
  background: transparent;
  border: 1px solid var(--border-light);
  color: var(--text-muted);
  padding: 0.4rem 0.9rem;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-nav:hover {
  border-color: var(--accent);
  color: var(--accent-light);
}

.btn-nav.danger:hover {
  background: rgba(192,57,43,0.1);
}

/* Main */
.main {
  position: relative;
  z-index: 1;
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
  animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.page-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.8rem;
  letter-spacing: 2px;
  color: var(--white);
}

.page-title span {
  color: var(--accent-light);
}

.btn-switch {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--card);
  border: 1px solid var(--border-light);
  color: var(--text);
  padding: 0.55rem 1rem;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
}

.btn-switch:hover {
  border-color: #3b82f6;
  color: #60a5fa;
  background: rgba(59,130,246,0.08);
}

/* Table */
.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
}

.table {
  width: 100%;
  border-collapse: collapse;
}

.table thead th {
  background: var(--surface);
  color: var(--text-muted);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 0.9rem 1.2rem;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

.table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}

.table tbody tr:last-child { border-bottom: none; }

.table tbody tr:hover { background: rgba(255,255,255,0.02); }

.table td {
  padding: 0.85rem 1.2rem;
  font-size: 0.88rem;
  vertical-align: middle;
}

.item-name {
  font-weight: 500;
  color: var(--text);
}

.qty-cell {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 1px;
  color: var(--white);
  min-width: 60px;
}

.qty-zero { color: var(--accent-light) !important; }

.actions-cell {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.btn-add, .btn-rem {
  padding: 0.35rem 0.85rem;
  border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}

.btn-add {
  background: rgba(39,174,96,0.12);
  color: #4ade80;
  border: 1px solid rgba(39,174,96,0.25);
}

.btn-add:hover {
  background: rgba(39,174,96,0.22);
  border-color: rgba(39,174,96,0.5);
  transform: translateY(-1px);
}

.btn-rem {
  background: rgba(192,57,43,0.12);
  color: #f87171;
  border: 1px solid rgba(192,57,43,0.25);
}

.btn-rem:hover {
  background: rgba(192,57,43,0.22);
  border-color: rgba(192,57,43,0.5);
  transform: translateY(-1px);
}

.btn-add:active, .btn-rem:active { transform: scale(0.96); }

/* Toast */
#toast-container {
  position: fixed;
  top: 1.5rem;
  right: 1.5rem;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.toast {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 0.9rem 1.2rem;
  min-width: 260px;
  max-width: 320px;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  animation: slideIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
}

.toast.hide { animation: slideOut 0.3s ease forwards; }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(60px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes slideOut {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(60px); }
}

.toast-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
.toast-body { flex: 1; }
.toast-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 0.15rem; }
.toast-msg { font-size: 0.78rem; color: var(--text-muted); }
.toast.success { border-left: 3px solid var(--success); }
.toast.error   { border-left: 3px solid var(--accent); }
.toast.info    { border-left: 3px solid #3b82f6; }

/* Loading overlay */
#loader {
  position: fixed;
  inset: 0;
  background: rgba(8,10,12,0.85);
  backdrop-filter: blur(4px);
  z-index: 8888;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1rem;
}

#loader.active { display: flex; }

.loader-ring {
  width: 44px;
  height: 44px;
  border: 3px solid var(--border-light);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loader-text {
  font-size: 0.8rem;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 5000;
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 380px;
  margin: 1rem;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  animation: modalIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.92) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 2px;
  margin-bottom: 0.4rem;
  color: var(--white);
}

.modal-sub {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

.modal-sub strong { color: var(--accent-light); }

.modal-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 1.1rem;
  font-weight: 500;
  padding: 0.75rem 1rem;
  outline: none;
  text-align: center;
  margin-bottom: 1.2rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.modal-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.modal-actions {
  display: flex;
  gap: 0.6rem;
}

.btn-modal {
  flex: 1;
  padding: 0.7rem;
  border-radius: 9px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}

.btn-cancel {
  background: var(--surface);
  border: 1px solid var(--border-light);
  color: var(--text-muted);
}

.btn-cancel:hover { border-color: var(--border-light); color: var(--text); }

.btn-confirm-add {
  background: rgba(39,174,96,0.15);
  border: 1px solid rgba(39,174,96,0.35);
  color: #4ade80;
}

.btn-confirm-add:hover { background: rgba(39,174,96,0.25); }

.btn-confirm-rem {
  background: rgba(192,57,43,0.15);
  border: 1px solid rgba(192,57,43,0.35);
  color: #f87171;
}

.btn-confirm-rem:hover { background: rgba(192,57,43,0.25); }
</style>
</head>
<body>

<div id="loader"><div class="loader-ring"></div><div class="loader-text">Mise à jour…</div></div>
<div id="toast-container"></div>

<!-- Modal quantité -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Ajouter au stock</div>
    <div class="modal-sub">Produit : <strong id="modalItem"></strong></div>
    <input type="number" class="modal-input" id="modalQty" placeholder="0" min="1">
    <div class="modal-actions">
      <button class="btn-modal btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-modal" id="modalConfirm" onclick="confirmAction()">Confirmer</button>
    </div>
  </div>
</div>

<nav class="navbar">
  <div class="nav-left">
    <img src="https://i.imgur.com/C3KSVoE.png" alt="CHL" class="nav-logo">
    <span class="nav-title">CHL Stock</span>
    <span class="nav-badge">Pharmacie</span>
  </div>
  <div class="nav-right">
    <span class="nav-user">Connecté : <span id="navUser"></span></span>
    <button class="btn-nav danger" onclick="logout()">Déconnexion</button>
  </div>
</nav>

<div class="main">
  <div class="page-header">
    <div class="page-title">Stock <span>Pharmacie</span></div>
    <a href="home2.html" class="btn-switch">🏥 Salle de soin →</a>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>Produit</th>
          <th>Quantité</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="stockTable"></tbody>
    </table>
  </div>
</div>

<script>
if (!localStorage.getItem('chl_logged_in')) window.location.href = 'index.html';
const logged = JSON.parse(localStorage.getItem('chl_logged_in'));
const USER = logged?.user || 'Inconnu';
document.getElementById('navUser').textContent = USER;

const API_BASE = 'https://chl-bot-gestion.onrender.com/api';

const ITEMS = [
  "Tablette","Garrot","Pansement de terrain","Bandage élastique",
  "Pansement hémostatique","Kit chirurgical","Pansement compressif",
  "Injecteur d'épinéphrine","Injecteur de morphine","Propofol100ml",
  "Propofol 250ml","Poche de sang 250ml","Poche de sang 500ml",
  "Poche de sang 750ml","Poche de sang 1000ml","Kit de réanimation d'urgence",
  "Moniteur ECG","Fentanyl","Ampoulier médical","Collier cervical",
  "Accès intra-osseux(IO)","Accès intraveineux(IV)","Dispositif de massage cardiaque"
];

let stock = JSON.parse(localStorage.getItem('chl_pharmacie_stock')) || {};
ITEMS.forEach(item => { if (!(item in stock)) stock[item] = 0; });

const tbody = document.getElementById('stockTable');
ITEMS.forEach((item, index) => {
  const tr = document.createElement('tr');
  const id = item.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
  tr.innerHTML = `
    <td class="item-name">${item}</td>
    <td><span class="qty-cell ${stock[item] === 0 ? 'qty-zero' : ''}" id="qty-${id}">${stock[item]}</span></td>
    <td class="actions-cell">
      <button class="btn-add" data-index="${index}" data-type="add">+ Ajouter</button>
      <button class="btn-rem" data-index="${index}" data-type="remove">− Retirer</button>
    </td>`;
  tbody.appendChild(tr);
});

document.getElementById('stockTable').addEventListener('click', e => {
  const btn = e.target.closest('[data-index]');
  if (!btn) return;
  const item = ITEMS[parseInt(btn.dataset.index)];
  const type = btn.dataset.type;
  openModal(item, type);
});

/* ---- Toast ---- */
function toast(type, title, msg) {
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <div class="toast-icon">${icons[type]}</div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      ${msg ? `<div class="toast-msg">${msg}</div>` : ''}
    </div>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 350); }, 4000);
}

function showLoader(txt) {
  document.querySelector('.loader-text').textContent = txt || 'Chargement…';
  document.getElementById('loader').classList.add('active');
}
function hideLoader() { document.getElementById('loader').classList.remove('active'); }

/* ---- Modal ---- */
let _modalItem = '', _modalType = '';

function openModal(item, type) {
  _modalItem = item;
  _modalType = type;
  document.getElementById('modalTitle').textContent = type === 'add' ? '➕ Ajouter au stock' : '➖ Retirer du stock';
  document.getElementById('modalItem').textContent = item;
  document.getElementById('modalQty').value = '';
  const confirmBtn = document.getElementById('modalConfirm');
  confirmBtn.className = 'btn-modal ' + (type === 'add' ? 'btn-confirm-add' : 'btn-confirm-rem');
  confirmBtn.textContent = type === 'add' ? 'Ajouter' : 'Retirer';
  document.getElementById('modalOverlay').classList.add('active');
  setTimeout(() => document.getElementById('modalQty').focus(), 100);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

async function confirmAction() {
  const qty = parseInt(document.getElementById('modalQty').value);
  if (!qty || qty <= 0) { toast('error', 'Quantité invalide', 'Entre un nombre supérieur à 0'); return; }

  closeModal();
  showLoader(_modalType === 'add' ? 'Ajout en cours…' : 'Retrait en cours…');

  const delta = _modalType === 'add' ? qty : -qty;
  stock[_modalItem] = Math.max(0, (stock[_modalItem] || 0) + delta);
  const id = _modalItem.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
  const qtyEl = document.getElementById(`qty-${id}`);

  await new Promise(r => setTimeout(r, 900));

  qtyEl.textContent = stock[_modalItem];
  qtyEl.className = 'qty-cell' + (stock[_modalItem] === 0 ? ' qty-zero' : '');
  localStorage.setItem('chl_pharmacie_stock', JSON.stringify(stock));

  hideLoader();

  const actionLabel = _modalType === 'add' ? 'ajouté' : 'retiré';
  toast('success', `Stock mis à jour`, `${qty} × ${_modalItem} ${actionLabel}`);

  try {
    await fetch(`${API_BASE}/log_stock`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: USER, item: _modalItem, delta, location: 'Pharmacie' })
    });
  } catch(err) {
    console.warn('Log non envoyé', err);
  }
}

// Fermer modal sur overlay click
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// Enter pour confirmer
document.getElementById('modalQty').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmAction();
  if (e.key === 'Escape') closeModal();
});

function logout() {
  localStorage.removeItem('chl_logged_in');
  localStorage.removeItem('chl_pharmacie_stock');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
